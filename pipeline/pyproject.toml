[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "despues-del-susto"
dynamic = ["version"]
description = "Local pipeline that catalogs the works recommended by the Tengo Miedo podcast."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "openai>=1.0",
    "pydantic-settings>=2.3",
    "rich>=13",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
dds = "despues_del_susto.cli:app"

[tool.hatch.version]
path = "src/despues_del_susto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/despues_del_susto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
